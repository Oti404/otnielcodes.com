# Inclus în contextul http al nginx.conf din imagine (conf.d/*.conf).

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  image/svg+xml;

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Caddy face TLS-ul; redirecturile generate de nginx rămân relative.
  absolute_redirect off;

  # Atenție: add_header dintr-un location anulează pe cele de la nivel de server,
  # de aceea headerele de securitate sunt incluse în fiecare location.
  include /etc/nginx/snippets/security-headers.conf;

  # index.html: mereu revalidat, ca un deploy nou să fie vizibil imediat.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Fișiere cu hash în nume generate de Angular (main-ABC123.js, styles-XYZ.css, chunk-*.js).
  location ~* "-[A-Z0-9]{8,}\.(js|css|mjs)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Datele catalogului: fără hash în nume, deci revalidate la fiecare vizită.
  location = /assets/projects.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Alte fișiere statice fără hash (imagini proiecte, favicon): cache moderat.
  location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Fallback SPA.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
