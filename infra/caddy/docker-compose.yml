# Pe server: ~/proiecte/caddy/docker-compose.yml (proiect compose "caddy" -> rețeaua caddy_default).
#
# Față de versiunea de dinainte de migrare:
#   - Caddyfile montat ca DIRECTOR (./conf), nu fișier singur: un fișier înlocuit de rsync
#     primește alt inode și nu s-ar mai vedea în container;
#   - imagine fixată (era caddy:2), healthcheck, capabilități reduse;
#   - scos ./site:/srv/site (nu-l mai folosea niciun site).
# Volumul caddy_data (pe disc: caddy_caddy_data) e același, deci certificatele se păstrează.

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # Rulează ca root (imaginea oficială): certificatele existente din caddy_data aparțin lui root.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

# Rețeaua implicită a proiectului "caddy" este caddy_default; celelalte proiecte se
# conectează la ea ca rețea externă.

volumes:
  caddy_data:
  caddy_config:
