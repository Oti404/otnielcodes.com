<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>otnielcodes.com — Proiecte</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Catalogul proiectelor lui Otniel Iacob, găzduite pe otnielcodes.com." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Aplică tema salvată înainte de randare, ca să nu apară flash-ul temei greșite.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Această pagină are nevoie de JavaScript pentru a afișa lista de proiecte.</noscript>
  </body>
</html>
